name: CI

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan_ruby:
    name: scan_ruby
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager

      - name: Scan Ruby dependencies for known vulnerabilities
        run: bundle exec bundler-audit check --update

  scan_js:
    name: scan_js
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install locked JavaScript check tools
        run: npm ci --ignore-scripts

      - name: Scan for security vulnerabilities in JavaScript dependencies
        run: bin/importmap audit

      - name: Scan npm dependencies for known vulnerabilities
        run: npm audit --audit-level=high

      - name: Scan pinned MathJax and font dependencies
        run: npm audit --prefix config/mathjax --audit-level=high

  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Lint code for consistent style
        run: bin/rubocop -f github

      - name: Check workflow security policy
        run: bin/rails test test/scripts/github_workflows_test.rb

  test:
    name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y build-essential git pkg-config google-chrome-stable

      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: |
          npm ci --ignore-scripts

      - name: Run JavaScript tests
        run: npm test

      - name: Validate content and run unit tests
        env:
          RAILS_ENV: test
        run: bin/rails content:validate test

      - name: Run system tests
        id: system_tests
        env:
          RAILS_ENV: test
        run: bin/rails test:system

      - name: Keep screenshots from failed system tests
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: screenshots
          path: |
            ${{ github.workspace }}/tmp/screenshots
          if-no-files-found: ignore

      - name: Summarize accessibility evidence and manual review needs
        if: ${{ !cancelled() && (steps.system_tests.outcome == 'success' || steps.system_tests.outcome == 'failure') }}
        run: npm run accessibility:summary

      - name: Keep accessibility evidence from system tests
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() && (steps.system_tests.outcome == 'success' || steps.system_tests.outcome == 'failure') }}
        with:
          name: accessibility-reports
          path: tmp/a11y
          if-no-files-found: warn

  cross_browser:
    name: cross_browser
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node_modules/.bin/playwright install --with-deps chromium firefox webkit
      - name: Check Firefox and WebKit interactions
        run: bin/check cross-browser
      - name: Check touch layouts and mobile interactions
        run: bin/check mobile
      - name: Keep cross-browser traces and reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: cross-browser-reports
          path: |
            tmp/cross-browser
            tmp/mobile-browser
          if-no-files-found: ignore

  images:
    name: images
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Detect image pipeline changes
        id: changes
        env:
          DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          DIFF_HEAD: ${{ github.sha }}
        run: python3 scripts/ci_image_changes.py
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        if: steps.changes.outputs.images == 'true'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/images/requirements.txt
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        if: steps.changes.outputs.images == 'true'
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install image authoring dependencies
        if: steps.changes.outputs.images == 'true'
        run: |
          sudo apt-get update && sudo apt-get install --no-install-recommends -y fonts-dejavu-core
          python -m pip install -r scripts/images/requirements.txt
          npm ci --ignore-scripts
      - name: Test and reproduce committed image exports
        if: steps.changes.outputs.images == 'true'
        run: |
          python -m unittest discover -s scripts/images -p 'test_*.py'
          python scripts/images/export.py --check

  production:
    name: production
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install Chrome for production performance checks
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y google-chrome-stable

      - name: Set up Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install locked browser check tools
        run: |
          npm ci --ignore-scripts
          node_modules/.bin/playwright install --with-deps chromium

      - name: Verify clean production build, boot, restart, and page budgets
        run: bin/production-check --performance

      - name: Build production container
        run: docker build --build-arg "RUBY_VERSION=$(tr -d '\n' < .ruby-version)" -t adrian-site:ci .

      - name: Check non-root container and health endpoint
        run: scripts/container-check.sh adrian-site:ci

      - name: Keep production and performance reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: production-reports
          path: |
            tmp/production-check
            tmp/performance
            tmp/visual-review
            tmp/container-check
          if-no-files-found: ignore
