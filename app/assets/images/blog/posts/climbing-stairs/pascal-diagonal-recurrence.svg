<svg xmlns="http://www.w3.org/2000/svg" width="820" height="443" viewBox="0 0 1000 540" role="img" aria-labelledby="title desc">
  <title id="title">Pascal triangle diagonal recurrence</title>
  <desc id="desc">Pascal triangle with the diagonal 1, 5, 6, 1 highlighted in orange and the two previous diagonals 1, 4, 3 and 1, 3, 1 highlighted in green.</desc>
  <style>
    .bg { fill: #f8fafc; }
    .cell { fill: #ffffff; stroke: #d8e1ee; stroke-width: 3; }
    .hit-orange { fill: #fff3d6; stroke: #ed8936; stroke-width: 5; }
    .hit-green { fill: #e6fffa; stroke: #38a169; stroke-width: 5; }
    .line-orange { stroke: #f97316; stroke-width: 10; stroke-linecap: round; stroke-linejoin: round; fill: none; opacity: .35; }
    .line-green { stroke: #38a169; stroke-width: 9; stroke-linecap: round; stroke-linejoin: round; fill: none; opacity: .28; }
    .num {
      fill: #334155;
      font-family: Arial, sans-serif;
      font-size: 25px;
      font-weight: 700;
      text-anchor: middle;
      dominant-baseline: central;
    }
    .orange-num {
      fill: #9a3412;
      font-family: Arial, sans-serif;
      font-size: 25px;
      font-weight: 700;
      text-anchor: middle;
      dominant-baseline: central;
    }
    .green-num {
      fill: #166534;
      font-family: Arial, sans-serif;
      font-size: 25px;
      font-weight: 700;
      text-anchor: middle;
      dominant-baseline: central;
    }
  </style>

  <rect class="bg" width="1000" height="540" rx="26"/>

  <path class="line-green" d="M316 332 L454 264 L592 196"/>
  <path class="line-green" d="M270 400 L408 332 L546 264"/>
  <path class="line-orange" d="M224 468 L362 400 L500 332 L638 264"/>

  <g>
    <circle class="cell" cx="500" cy="60" r="30"/>
    <text class="num" x="500" y="60">1</text>
  </g>

  <g>
    <circle class="cell" cx="454" cy="128" r="30"/>
    <text class="num" x="454" y="128">1</text>
    <circle class="cell" cx="546" cy="128" r="30"/>
    <text class="num" x="546" y="128">1</text>
  </g>

  <g>
    <circle class="cell" cx="408" cy="196" r="30"/>
    <text class="num" x="408" y="196">1</text>
    <circle class="cell" cx="500" cy="196" r="30"/>
    <text class="num" x="500" y="196">2</text>
    <circle class="hit-green" cx="592" cy="196" r="33"/>
    <text class="green-num" x="592" y="196">1</text>
  </g>

  <g>
    <circle class="cell" cx="362" cy="264" r="30"/>
    <text class="num" x="362" y="264">1</text>
    <circle class="hit-green" cx="454" cy="264" r="33"/>
    <text class="green-num" x="454" y="264">3</text>
    <circle class="hit-green" cx="546" cy="264" r="33"/>
    <text class="green-num" x="546" y="264">3</text>
    <circle class="hit-orange" cx="638" cy="264" r="33"/>
    <text class="orange-num" x="638" y="264">1</text>
  </g>

  <g>
    <circle class="hit-green" cx="316" cy="332" r="33"/>
    <text class="green-num" x="316" y="332">1</text>
    <circle class="hit-green" cx="408" cy="332" r="33"/>
    <text class="green-num" x="408" y="332">4</text>
    <circle class="hit-orange" cx="500" cy="332" r="33"/>
    <text class="orange-num" x="500" y="332">6</text>
    <circle class="cell" cx="592" cy="332" r="30"/>
    <text class="num" x="592" y="332">4</text>
    <circle class="cell" cx="684" cy="332" r="30"/>
    <text class="num" x="684" y="332">1</text>
  </g>

  <g>
    <circle class="hit-green" cx="270" cy="400" r="33"/>
    <text class="green-num" x="270" y="400">1</text>
    <circle class="hit-orange" cx="362" cy="400" r="33"/>
    <text class="orange-num" x="362" y="400">5</text>
    <circle class="cell" cx="454" cy="400" r="30"/>
    <text class="num" x="454" y="400">10</text>
    <circle class="cell" cx="546" cy="400" r="30"/>
    <text class="num" x="546" y="400">10</text>
    <circle class="cell" cx="638" cy="400" r="30"/>
    <text class="num" x="638" y="400">5</text>
    <circle class="cell" cx="730" cy="400" r="30"/>
    <text class="num" x="730" y="400">1</text>
  </g>

  <g>
    <circle class="hit-orange" cx="224" cy="468" r="33"/>
    <text class="orange-num" x="224" y="468">1</text>
    <circle class="cell" cx="316" cy="468" r="30"/>
    <text class="num" x="316" y="468">6</text>
    <circle class="cell" cx="408" cy="468" r="30"/>
    <text class="num" x="408" y="468">15</text>
    <circle class="cell" cx="500" cy="468" r="30"/>
    <text class="num" x="500" y="468">20</text>
    <circle class="cell" cx="592" cy="468" r="30"/>
    <text class="num" x="592" y="468">15</text>
    <circle class="cell" cx="684" cy="468" r="30"/>
    <text class="num" x="684" y="468">6</text>
    <circle class="cell" cx="776" cy="468" r="30"/>
    <text class="num" x="776" y="468">1</text>
  </g>
</svg>
